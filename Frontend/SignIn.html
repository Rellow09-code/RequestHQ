<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Requests HQ</title>
        <link rel="stylesheet" href="auth.css">
        <script type="module" src="dist/auth.js"></script>
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    </head> 
    <body>
        <main id="main_header">
            <h1>Tell us about yourself</h1>
            <main id="UserInfo" class="UserInfo">
                <section class="card">
                    <section class="card_header">
                        <h3>Who am I?</h3>
                    </section>
                    <section class="card_body">
                        <section class="form_fields ">

                            <section class="wrapper">
                                <label>Name</label>
                                <input id="name" type="text">
                            </section>

                            <section class="wrapper">
                                <label>Middle Name</label>
                                <input id="middle_name" type="text">
                            </section>

                            <section class="wrapper">
                                <label>Surname</label>
                                <input id="surname" type="text">
                            </section>

                            <section class="wrapper">
                                <label>Birth date</label>
                                <input id="birth_date" type="date">
                            </section>

                        </section>
                    </section>
                    <section class="edit_card_buttons">
                        <button class="next" id="next">next</button>
                    </section>
                    <h1 id="feedback" class="feedback"></h1>
                </section>
            </main>
            <main id="Contact_details">
                <section class="card">
                    <section class="card_header">
                        <h3>Contact and Address</h3>
                    </section>
                    <section class="card_body">
                        <section class="form_fields ">

                            <section class="wrapper">
                                <label>Email</label>
                                <input id="email" type="email">
                            </section>

                            <section class="wrapper">
                                <label>Phone number</label>
                                <input id="phone" type="tel" placeholder="+27 00 000 000">
                            </section>

                            <section class="wrapper">
                                <label>Street</label>
                                <input id="street" type="text">
                            </section>

                            <section class="wrapper">
                                <label>city</label>
                                <input id="city" type="text">
                            </section>

                            <section class="wrapper">
                                <label>Province/State</label>
                                <input id="province" type="text">
                            </section>

                            <section class="wrapper">
                                <label>Country</label>
                                <input id="country" type="text">
                            </section>

                        </section>
                    </section>
                    <section class="edit_card_buttons">
                        <button class="prev" id="prev2">prev</button>
                        <button class="next" id="next2">next</button>
                    </section>
                    <h1 id="feedback1" class="feedback"></h1>
                </section>
            </main>
            <main id="authentication">
                <section class="card">
                    <section class="card_header">
                        <h3>Authentication Setup</h3>
                    </section>
                    <section class="card_body">
                        <section class="form_fields ">

                            <section class="wrapper">
                                <label>Password</label>
                                <input id="password" type="password">
                            </section>

                            <section class="wrapper">
                                <label>Confirm Password</label>
                                <input id="confirm_password" type="password">
                            </section>

                        </section>
                    </section>
                    <section class="edit_card_buttons">
                        <button class="prev" id="prev3">prev</button>
                        <button class="next" id="Submit">Submit</button>
                    </section>
                    <h1 id="feedback2" class="feedback"></h1>
                </section>
            </main>
        </main>
        
    </body>
</html>
