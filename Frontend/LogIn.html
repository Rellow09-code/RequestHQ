<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Requests HQ</title>
        <link rel="stylesheet" href="auth.css">
        <script type="module" src="dist/log_auth.js"></script>
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    </head>
    <body>
        <main id="main_header">
            <h1>Welcome back</h1>
            <main class="UserInfo" id="log_details">
                <section class="card">
                    <section class="card_header">
                        <h3>Authentication Setup</h3>
                    </section>
                    <section class="card_body">
                        <section class="form_fields ">

                            <section class="wrapper">
                                <label>Email</label>
                                <input id="email" type="email">
                            </section>


                            <section class="wrapper">
                                <label>Password</label>
                                <input id="password" type="password">
                            </section>
                        </section>
                    </section>
                    <section class="edit_card_buttons">
                        <button class="next" id="Submit">Submit</button>
                    </section>
                    <h1 id="feedback2" class="feedback"></h1>
                </section>
            </main>
        </main>
        
    </body>
</html>
