<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Requests HQ</title>
        <link rel="stylesheet" href="app.css">
        <script type="module" src="dist/app.js"></script>
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    </head>
    <body>
        <header id="main_header">
            <div class="profile_UI">
                <img src="https://wallpapers.com/images/hd/best-anime-pictures-3200-x-1800-yszc314pcdgxyala.jpg" alt="">
                <p><b>Hulisani Netshaulu</b></p>
            </div>
            <section id="main_header_buttons">
                <i class="material-icons" id="home">home</i>
                <i class="material-icons" id="notifications">notifications</i>
                <i class="material-icons" id="message">message</i>
                <i class="material-icons" id="post_add">post_add</i>
                <i class="material-icons" id="density_medium">density_medium</i>
                <i class="material-icons" id="refresh">refresh</i>
            </section>
        </header>
        <main id="home_main">
        </main>
        <main id="posting_main">
            <div class="card">
                <section class="card_header">
                    <div class="profile_UI">
                        <img src="https://wallpapers.com/images/hd/best-anime-pictures-3200-x-1800-yszc314pcdgxyala.jpg">
                        <p><b>Hulisani Netshaulu</b></p>
                    </div>
                    <h3><input id="post_title" type="text" placeholder="Title"></h3>
                </section>
                <section class="card_body">
                    <textarea id="post_text" placeholder="text"></textarea>
                    <div class="image_upload">
                        <label>Upload a picture</label>
                        <input id="post_picture" type="file" accept="image/*">
                    </div>
                </section>
                <section class="edit_card_buttons">
                    <button id="cancel_post" onclick="">Cancel</button>
                    <button id="post">Post</button>
                </section>
            </div>
        </main>
    </body>
</html>
